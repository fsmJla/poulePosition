<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Smartphone : saisie du tableau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#066f6c}a:hover{color:#044e4c}
button{font-family:inherit}
button:focus-visible{outline:3px solid #078a86;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f4ef; color: #1c2b2a; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #2f4b4a; color: #f7f4ef">
<button type="button" aria-label="Retour" title="Retour" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 10px; background: transparent; color: #f7f4ef; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</button>
<div style="flex: 1; min-width: 0">
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">{{titre}}</p>
<p style="margin: 0; font-size: 13px; opacity: 0.85">{{sousTitre}}</p>
</div>
<span role="img" aria-label="Connecté" title="Connecté" style="width: 12px; height: 12px; margin-right: 8px; border-radius: 999px; background: #4cc38a; border: 2px solid #f7f4ef"></span>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 16px 0">
<sc-for list="{{cotes}}" as="c" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: center">
<p style="margin: 0; font-size: 17px; line-height: 1.25"><strong style="{{c.nomStyle}}">{{c.nom}}</strong> {{c.prenom}}<br><span style="font-size: 13px; color: #55615f">{{c.detail}}</span></p>
<button type="button" aria-label="{{c.aria}}" onClick="{{c.ouvrir}}" style="{{c.style}}">{{c.valeur}}</button>
</div>
</sc-for>
</div>

<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 260px; box-sizing: border-box">
<sc-if value="{{padOuvert}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 15px; color: #55615f; text-align: center">Score de <strong style="{{padNomStyle}}">{{padNom}}</strong></p>
<div role="group" aria-label="Score de {{padNom}}" style="{{grilleStyle}}">
<sc-for list="{{touches}}" as="t" hint-placeholder-count="16">
<button type="button" aria-label="{{t.aria}}" aria-pressed="{{t.presse}}" onClick="{{t.choisir}}" style="{{t.style}}">{{t.libelle}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{priorite}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; color: #8a560c; font-weight: 600; text-align: center">Égalité : qui a la priorité ?</p>
<div role="group" aria-label="Vainqueur par priorité" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{choixPriorite}}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{c.presse}}" onClick="{{c.choisir}}" style="{{c.style}}">{{c.nom}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{repos}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #55615f; text-align: center">Touchez un score pour le corriger.</p>
</sc-if>
<p role="status" style="{{messageStyle}}">{{message}}</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px">
<button type="button" style="height: 52px; border: 1px solid #7d8886; border-radius: 999px; background: #ffffff; color: #1c2b2a; font-size: 16px; font-weight: 600; cursor: pointer">Retour</button>
<button type="button" disabled="{{invalide}}" onClick="{{envoyer}}" style="{{envoyerStyle}}">Envoyer à la table</button>
</div>

<p style="margin: auto 16px 20px; padding: 16px; border: 1px dashed #d5ccbf; border-radius: 12px; font-size: 14px; color: #55615f; text-align: center">{{basDePage}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Configuration : tableau en 15 touches (pavé de 16, quatre colonnes).
  config() {
    return {
      N: 15, colonnes: 4, hauteur: 56, egalitePermise: true,
      titre: 'Match 5 · Tableau de 16', sousTitre: 'Piste 3 · M13 Dames · en 15 touches',
      g: { nom: 'BERNARD', prenom: 'Inès', detail: 'tête de série 3 · à gauche' },
      d: { nom: 'MICHEL', prenom: 'Julia', detail: 'tête de série 14 · à droite' },
      basDePage: 'Dans le tableau : inchangé (planche 15)'
    };
  }

  state = { actif: 'g', g: null, d: null, prio: null, envoye: false, erreur: null };

  choisir(v) {
    const K = this.config();
    const s = this.state;
    const a = s.actif;
    if (!a) return;
    const o = a === 'g' ? 'd' : 'g';
    const maj = { prio: null, envoye: false, erreur: null };
    maj[a] = v;
    if (s[o] === null) { maj.actif = o; this.setState(maj); return; }
    const g = a === 'g' ? v : s.g, d = a === 'd' ? v : s.d;
    const raz = { actif: 'g', g: null, d: null, prio: null, envoye: false };
    if (g === K.N && d === K.N) { raz.erreur = 'Un seul « V » : recommencez'; this.setState(raz); return; }
    if (g === d && !K.egalitePermise) { raz.erreur = 'Pas d’égalité en poule : recommencez'; this.setState(raz); return; }
    maj.actif = null;
    this.setState(maj);
  }

  renderVals() {
    const K = this.config();
    const s = this.state;
    const T = {
      g: Object.assign({ couleur: '#b3362f', teinte: '#f9ecea' }, K.g),
      d: Object.assign({ couleur: '#1f7a4d', teinte: '#e8f3ed' }, K.d)
    };
    const a = s.actif;
    const aff = (x) => (x === K.N ? 'V' : String(x));

    const cotes = ['g', 'd'].map((c) => {
      const actif = a === c;
      const vide = s[c] === null;
      return {
        nom: T[c].nom, prenom: T[c].prenom, detail: T[c].detail,
        nomStyle: 'letter-spacing: 0.02em; color: ' + T[c].couleur + ';',
        valeur: vide ? '–' : (K.N === 5 ? aff(s[c]) : String(s[c])),
        aria: 'Score de ' + T[c].nom + ' : ' + (vide ? 'à choisir' : aff(s[c])) + (actif ? '' : ' (modifier)'),
        ouvrir: () => this.setState({ actif: c, envoye: false, erreur: null }),
        style: 'height: 96px; border-radius: 16px; cursor: pointer; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; color: ' + (vide ? '#8d9694' : T[c].couleur) + ';' +
          (actif ? 'background: ' + T[c].teinte + '; border: 3px solid ' + T[c].couleur + ';' : 'background: #ffffff; border: 1px solid #d5ccbf;')
      };
    });

    const touches = [];
    if (a) {
      for (let v = 0; v <= K.N; v++) {
        const choisi = s[a] === v;
        touches.push({
          libelle: aff(v),
          aria: aff(v) + ' pour ' + T[a].nom,
          presse: choisi ? 'true' : 'false',
          choisir: () => this.choisir(v),
          style: 'height: ' + K.hauteur + 'px; border-radius: 14px; font-size: 22px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;' +
            (choisi ? 'background: ' + T[a].couleur + '; border: 2px solid ' + T[a].couleur + '; color: #ffffff;' : 'background: #ffffff; border: 2px solid ' + T[a].couleur + '; color: #1c2b2a;')
        });
      }
    }

    const g = s.g, d = s.d;
    const complet = g !== null && d !== null && !a;
    const egalite = complet && g === d;
    let valide = false, message = a ? '' : '', couleur = '#55615f';
    if (s.erreur) { message = s.erreur; couleur = '#b3362f'; }
    else if (complet) {
      if (egalite && !s.prio) { message = 'Égalité : désignez le vainqueur'; couleur = '#8a560c'; }
      else {
        const v = s.prio ? s.prio : (g === K.N ? 'g' : d === K.N ? 'd' : g > d ? 'g' : 'd');
        const mode = s.prio ? ' par priorité' : (g === K.N || d === K.N) ? '' : ' au temps';
        const sc = Math.max(g, d) + ' à ' + Math.min(g, d);
        message = 'Victoire' + mode + ' de ' + T[v].nom + ', ' + sc + '.';
        couleur = '#14573a';
        valide = true;
      }
    }
    if (s.envoye) { message = '✓ Envoyé à la table : en attente de validation'; couleur = '#14573a'; }

    const choixPriorite = ['g', 'd'].map((c) => {
      const choisi = s.prio === c;
      return {
        nom: T[c].nom,
        presse: choisi ? 'true' : 'false',
        choisir: () => this.setState({ prio: c }),
        style: 'height: 52px; border-radius: 999px; font-size: 16px; font-weight: 600; cursor: pointer; border: 2px solid ' + T[c].couleur + ';' +
          (choisi ? 'background: ' + T[c].couleur + '; color: #ffffff;' : 'background: #ffffff; color: ' + T[c].couleur + ';')
      };
    });

    const actifEnvoi = valide && !s.envoye;
    return {
      titre: K.titre,
      sousTitre: K.sousTitre,
      basDePage: K.basDePage,
      cotes: cotes,
      padOuvert: !!a,
      padNom: a ? T[a].nom : '',
      padNomStyle: 'color: ' + (a ? T[a].couleur : '#1c2b2a') + ';',
      grilleStyle: 'display: grid; grid-template-columns: repeat(' + K.colonnes + ', minmax(0, 1fr)); gap: 8px;',
      touches: touches,
      priorite: egalite && !s.erreur,
      choixPriorite: choixPriorite,
      repos: !a && !egalite,
      message: message,
      messageStyle: 'margin: 0; min-height: 24px; font-size: 16px; font-weight: 600; text-align: center; color: ' + couleur + ';',
      invalide: !actifEnvoi,
      envoyer: () => this.setState({ envoye: true }),
      envoyerStyle: 'height: 52px; border: none; border-radius: 999px; font-size: 16px; font-weight: 600;' +
        (actifEnvoi ? 'background: #0abab5; color: #0f1716; cursor: pointer;' : 'background: #efe9e0; color: #6b7472; cursor: not-allowed;')
    };
  }
}
</script>
</body>
</html>
