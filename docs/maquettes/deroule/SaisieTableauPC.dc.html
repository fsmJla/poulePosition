<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Afficheur, actions en boutons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#066f6c}a:hover{color:#044e4c}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #078a86;outline-offset:2px}
</style>
</helmet>
<div style="width: 1120px; height: 580px; box-sizing: border-box; padding: 40px; background: #f7f4ef; color: #1c2b2a; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
<section aria-labelledby="titre-match-bis" style="background: #ffffff; border: 1px solid #e2dbd0; border-radius: 16px; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #e2dbd0">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 id="titre-match-bis" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Tableau de 32 · match 6</h2>
<p style="margin: 0; font-size: 14px; color: #55615f">{{statutPiste}}</p>
</div>
<div role="group" aria-label="Piste du match" style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 14px; color: #55615f; margin-right: 4px">Piste</span>
<sc-for list="{{pistes}}" as="p" hint-placeholder-count="4">
<sc-if value="{{p.nonChoisie}}" hint-placeholder-val="{{ true }}">
<button type="button" title="{{p.titre}}" aria-pressed="false" onClick="{{p.choisir}}" style="{{p.style}}">{{p.numero}}</button>
</sc-if>
<sc-if value="{{p.estChoisie}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 2px; height: 44px; box-sizing: border-box; padding: 0 4px 0 16px; border-radius: 999px; background: #2f4b4a; color: #f7f4ef; font-size: 16px; font-weight: 600">
<span aria-label="Piste du match : {{p.numero}}">{{p.numero}}</span>
<button type="button" onClick="{{retirer}}" aria-label="Retirer la piste {{p.numero}}" title="Retirer la piste" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: transparent; color: #f7f4ef; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</span>
</sc-if>
</sc-for>
<sc-if value="{{autreFerme}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ouvrirAutre}}" title="Appeler sur une piste qui n'est pas dans la liste" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #7d8886; background: #ffffff; color: #1c2b2a; font-size: 15px; font-weight: 600; cursor: pointer">Autre…</button>
</sc-if>
<sc-if value="{{autreOuvert}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 6px">
<input type="number" min="1" max="99" placeholder="N°" aria-label="Numéro de piste" onInput="{{saisirAutre}}" style="width: 72px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #078a86; border-radius: 999px; background: #ffffff; color: #1c2b2a; font-size: 16px; font-weight: 600">
<button type="button" onClick="{{appelerAutre}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #066f6c; background: #e3f1f0; color: #066f6c; font-size: 15px; font-weight: 600; cursor: pointer">Appeler</button>
</span>
</sc-if>
</div>
</header>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 28px; padding: 28px 32px 4px">
<div style="text-align: right">
<p style="margin: 0; font-size: 22px"><span style="font-size: 15px; color: #55615f">(12)</span> <strong style="color: #b3362f; letter-spacing: 0.02em">GIRARD</strong> Léna</p>
<p style="margin: 0; font-size: 14px; color: #55615f">Côté gauche</p>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="{{boiteG.aria}}" onClick="{{boiteG.ouvrir}}" style="{{boiteG.style}}">{{boiteG.valeur}}</button>
<span aria-hidden="true" style="font-size: 40px; color: #8d9694">–</span>
<button type="button" aria-label="{{boiteD.aria}}" onClick="{{boiteD.ouvrir}}" style="{{boiteD.style}}">{{boiteD.valeur}}</button>
</div>
<div style="text-align: left">
<p style="margin: 0; font-size: 22px"><strong style="color: #1f7a4d; letter-spacing: 0.02em">SIMON</strong> Rose <span style="font-size: 15px; color: #55615f">(21)</span></p>
<p style="margin: 0; font-size: 14px; color: #55615f">Côté droit</p>
</div>
</div>

<div style="min-height: 120px; box-sizing: border-box; padding: 16px 32px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<sc-if value="{{padOuvert}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 15px; color: #55615f">Score de <strong style="{{padNomStyle}}">{{padNom}}</strong></p>
<div role="group" aria-label="Score de {{padNom}}" style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{touches}}" as="t" hint-placeholder-count="16">
<button type="button" aria-label="{{t.aria}}" aria-pressed="{{t.presse}}" onClick="{{t.choisir}}" style="{{t.style}}">{{t.libelle}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{priorite}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; color: #8a560c; font-weight: 600">Égalité : qui a la priorité ?</p>
<div role="group" aria-label="Vainqueur par priorité" style="display: flex; gap: 12px">
<sc-for list="{{choixPriorite}}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{c.presse}}" onClick="{{c.choisir}}" style="{{c.style}}">{{c.nom}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{repos}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #55615f">Touchez un score pour le corriger.</p>
</sc-if>
</div>

<footer style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 80px; box-sizing: border-box; padding: 16px 24px; border-top: 1px solid #e2dbd0">
<button type="button" style="height: 48px; padding: 0 20px; border: 1px solid #7d8886; border-radius: 10px; background: #ffffff; color: #1c2b2a; font-size: 15px; font-weight: 600; cursor: pointer">Abandon, forfait, exclusion…</button>
<p role="status" style="{{messageStyle}}">{{message}}</p>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":580}}'>
class Component extends DCLogic {
  state = { actif: 'g', g: null, d: null, prio: null, fait: false, erreur: null, piste: null, autre: false, autreValeur: '' };

  // Deux choix = enregistré : le premier choix passe à l'autre tireur, le second enregistre.
  choisir(v) {
    const s = this.state;
    const a = s.actif;
    if (!a) return;
    const o = a === 'g' ? 'd' : 'g';
    const maj = { prio: null, fait: false, erreur: null };
    maj[a] = v;
    if (s[o] === null) { maj.actif = o; this.setState(maj); return; }
    const g = a === 'g' ? v : s.g, d = a === 'd' ? v : s.d;
    if (g === 15 && d === 15) { this.setState({ actif: 'g', g: null, d: null, prio: null, fait: false, erreur: 'Un seul « V » : recommencez' }); return; }
    maj.actif = null;
    maj.fait = g !== d;
    this.setState(maj);
  }

  renderVals() {
    const s = this.state;
    const T = {
      g: { nom: 'GIRARD', couleur: '#b3362f', teinte: '#f9ecea' },
      d: { nom: 'SIMON', couleur: '#1f7a4d', teinte: '#e8f3ed' }
    };

    const occupees = { 3: 'Occupée : tableau de 32 · match 4' };
    const numeros = [1, 2, 3, 4];
    if (s.piste !== null && numeros.indexOf(s.piste) < 0) numeros.push(s.piste);
    numeros.sort((x, y) => x - y);
    const basePiste = 'min-width: 44px; height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #7d8886; background: #ffffff; color: #1c2b2a; font-size: 16px; font-weight: 600; cursor: pointer;';
    const pistes = numeros.map((n) => {
      const choisie = s.piste === n;
      let style = basePiste;
      let titre = 'Appeler sur la piste ' + n;
      if (occupees[n]) { style += 'border-style: dashed; color: #55615f;'; titre = occupees[n]; }
      else if (s.piste === null && n === 1) { style += 'border: 2px solid #0abab5; background: #e3f1f0;'; titre = 'Piste libre proposée'; }
      return { numero: String(n), titre: titre, estChoisie: choisie, nonChoisie: !choisie, style: style, choisir: () => this.setState({ piste: n, autre: false }) };
    });

    const boite = (c) => {
      const actif = s.actif === c;
      const vide = s[c] === null;
      return {
        valeur: vide ? '–' : String(s[c]),
        aria: 'Score de ' + T[c].nom + ' : ' + (vide ? 'à choisir' : s[c] === 15 ? 'V' : s[c]) + (actif ? '' : ' (modifier)'),
        ouvrir: () => this.setState({ actif: c, fait: false, erreur: null }),
        style: 'width: 120px; height: 112px; border-radius: 16px; cursor: pointer; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; color: ' + (vide ? '#8d9694' : T[c].couleur) + ';' +
          (actif ? 'background: ' + T[c].teinte + '; border: 3px solid ' + T[c].couleur + ';' : 'background: #ffffff; border: 1px solid #d5ccbf;')
      };
    };

    const a = s.actif;
    const touches = [];
    if (a) {
      for (let v = 0; v <= 15; v++) {
        const choisi = s[a] === v;
        let st = 'height: 48px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;' + (v === 15 ? 'width: 64px; margin-left: 10px;' : 'width: 48px;');
        st += choisi ? 'background: ' + T[a].couleur + '; border: 1px solid ' + T[a].couleur + '; color: #ffffff;' : 'background: #ffffff; border: 1px solid #d5ccbf; color: #1c2b2a;';
        touches.push({
          libelle: v === 15 ? 'V' : String(v),
          aria: (v === 15 ? 'V' : String(v)) + ' pour ' + T[a].nom,
          presse: choisi ? 'true' : 'false',
          style: st,
          choisir: () => this.choisir(v)
        });
      }
    }

    const g = s.g, d = s.d;
    const complet = g !== null && d !== null;
    const egalite = complet && g === d && !a;
    let message = a ? 'Choisissez le score de ' + T[a].nom : '', couleur = '#55615f';
    if (s.erreur) { message = s.erreur; couleur = '#b3362f'; }
    else if (egalite && !s.prio) { message = 'Égalité : désignez le vainqueur'; couleur = '#8a560c'; }
    else if (s.fait) {
      const v = s.prio ? s.prio : (g === 15 ? 'g' : d === 15 ? 'd' : g > d ? 'g' : 'd');
      const mode = s.prio ? ' par priorité' : (g === 15 || d === 15) ? '' : ' au temps';
      message = '✓ Enregistré : ' + g + '–' + d + ', victoire' + mode + ' de ' + T[v].nom;
      couleur = '#14573a';
    }

    const choixPriorite = ['g', 'd'].map((c) => {
      const choisi = s.prio === c;
      return {
        nom: T[c].nom,
        presse: choisi ? 'true' : 'false',
        choisir: () => this.setState({ prio: c, fait: true }),
        style: 'height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 600; cursor: pointer; border: 2px solid ' + T[c].couleur + ';' +
          (choisi ? 'background: ' + T[c].couleur + '; color: #ffffff;' : 'background: #ffffff; color: ' + T[c].couleur + ';')
      };
    });

    return {
      statutPiste: s.piste === null ? 'À tirer · la piste 1 est libre' : 'En piste ' + s.piste + ' · appelé à 11 h 20',
      pistes: pistes,
      retirer: () => this.setState({ piste: null }),
      autreFerme: !s.autre,
      autreOuvert: s.autre,
      ouvrirAutre: () => this.setState({ autre: true, autreValeur: '' }),
      saisirAutre: (e) => this.setState({ autreValeur: e.target.value }),
      appelerAutre: () => {
        const n = parseInt(this.state.autreValeur, 10);
        if (n >= 1 && n <= 99) this.setState({ piste: n, autre: false });
      },
      boiteG: boite('g'),
      boiteD: boite('d'),
      padOuvert: !!a,
      padNom: a ? T[a].nom : '',
      padNomStyle: 'color: ' + (a ? T[a].couleur : '#1c2b2a') + ';',
      touches: touches,
      priorite: egalite,
      choixPriorite: choixPriorite,
      repos: !a && !egalite,
      message: message,
      messageStyle: 'margin: 0; font-size: 15px; font-weight: 600; color: ' + couleur + ';'
    };
  }
}
</script>
</body>
</html>
