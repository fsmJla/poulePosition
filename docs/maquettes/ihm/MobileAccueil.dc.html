<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Smartphone : accueil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#066f6c}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #f7f4ef; color: #1c2b2a; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 16px; background: #2f4b4a; color: #f7f4ef">
<a href="MobileAccueil.dc.html" style="flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: #f7f4ef; text-decoration: none">Poule Position</a>
<button type="button" aria-label="Rechercher" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 10px; background: transparent; color: #f7f4ef; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.500-3.500"></path></svg>
</button>
<button type="button" aria-label="Menu de compte de Julien Lameyre : comptes, aide, thème, déconnexion" style="width: 36px; height: 36px; margin: 0 4px; border: 2px solid #f7f4ef; border-radius: 999px; background: #066f6c; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">JL</button>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 96px">

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em">Manifestations et compétitions</h1>

<div role="group" aria-label="Filtrer" style="display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #2f4b4a; border-radius: 999px; background: #2f4b4a; color: #f7f4ef; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">À venir et en cours</button>
<button type="button" aria-pressed="false" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #7d8886; border-radius: 999px; background: #ffffff; color: #1c2b2a; font: inherit; font-size: 15px; cursor: pointer">Terminées</button>
<button type="button" aria-pressed="false" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #7d8886; border-radius: 999px; background: #ffffff; color: #1c2b2a; font: inherit; font-size: 15px; cursor: pointer">Archivées</button>
</div>

<a href="MobileAccueil.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e6cf9c; border-radius: 12px; background: #fbf3e2; color: #1c2b2a; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a560c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"></path></svg>
<span style="flex: 1; font-size: 15px"><strong style="font-weight: 600">4 épreuves à rattacher</strong></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
</a>

<section style="display: flex; flex-direction: column; border: 1px solid #e2dbd0; border-radius: 14px; background: #ffffff; overflow: hidden">
<div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px 6px 12px 14px; border-bottom: 1px solid #e2dbd0">
<div style="flex: 1; min-width: 0">
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #dcefe5; color: #14573a; font-size: 13px; font-weight: 600">Aujourd'hui</span>
<h2 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; line-height: 1.2">Grand Week end du SPUC</h2>
<div style="color: #55615f; font-size: 14px">11 et 12 novembre 2026 · Pessac</div>
</div>
<button type="button" aria-label="Autres actions pour Grand Week end du SPUC" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 10px; background: transparent; color: #1c2b2a; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.800"></circle><circle cx="12" cy="12" r="1.800"></circle><circle cx="12" cy="19" r="1.800"></circle></svg>
</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: #f7f4ef; border-bottom: 1px solid #e2dbd0">
<span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 4px; background: #9c5214"></span>
<div style="flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Championnats de Nouvelle Aquitaine</div>
<span style="flex: none; color: #55615f; font-size: 14px">Sabre</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg>
</div>
<sc-for list="{{ epreuves }}" as="e" hint-placeholder-count="5">
<a href="MobileEpreuve.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 4px 10px 4px 14px; border-bottom: 1px solid #efe9e0; color: #1c2b2a; text-decoration: none">
<div style="flex: 1; min-width: 0">
<div style="font-weight: 600">{{ e.nom }}</div>
<div style="color: {{ e.couleurStatut }}; font-size: 14px">{{ e.statut }}</div>
</div>
<sc-if value="{{ e.publiee }}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Publiée" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#066f6c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
<sc-if value="{{ e.nonPubliee }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Non publiée" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7d8886" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="M4 4l16 16"></path></svg>
</sc-if>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55615f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</sc-for>

<div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-bottom: 1px solid #efe9e0">
<span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 4px; background: #066f6c"></span>
<div style="flex: 1; min-width: 0; font-weight: 600; font-size: 15px">Challenge Lambart</div>
<span style="flex: none; color: #55615f; font-size: 14px">Épée · 1</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px">
<span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 4px; background: #7358a8"></span>
<div style="flex: 1; min-width: 0; font-weight: 600; font-size: 15px">Challenge Orpi</div>
<span style="flex: none; color: #55615f; font-size: 14px">Épée · 1</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
</div>
</section>

</main>

<button type="button" style="position: absolute; right: 16px; bottom: 20px; display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px 0 18px; border: none; border-radius: 999px; background: #0abab5; color: #0f1716; font: inherit; font-weight: 600; box-shadow: 0 6px 18px rgb(0 0 0 / 0.25); cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
Créer
</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ligne = (nom, enCours, publiee) => ({
nom: nom,
statut: enCours ? 'En cours · poules' : 'En préparation',
couleurStatut: enCours ? '#14573a' : '#55615f',
publiee: publiee,
nonPubliee: !publiee
});
return {
epreuves: [
ligne('M7 Mixte', true, true),
ligne('M9 Mixte', true, true),
ligne('M11 Mixte', false, true),
ligne('M13 Dames', false, false),
ligne('M13 Hommes', false, false)
]
};
}
}
</script>
</body>
</html>
