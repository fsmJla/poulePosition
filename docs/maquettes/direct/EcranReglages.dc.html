<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Régler un écran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#066f6c}a:hover{color:#044e4c}
</style>
</helmet>
<div style="width: 1360px; height: 1100px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: rgb(28 43 42 / 0.55); color: #1c2b2a; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

<form aria-labelledby="titre-ecran" style="width: 640px; display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 16px; background: #f7f4ef; box-shadow: 0 16px 48px rgb(0 0 0 / 0.3)">
<h2 id="titre-ecran" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">Écran de la salle A</h2>

<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600">Nom de l'écran
<input type="text" value="Écran de la salle A" style="height: 44px; padding: 0 12px; border: 1px solid #7d8886; border-radius: 10px; background: #ffffff; font: inherit; font-weight: 400">
</label>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 6px; font-weight: 600">Épreuves affichées</legend>
<span style="font-size: 15px; color: #55615f; margin-top: -4px">Publiées ou non : l'écran les affiche par son lien.</span>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border: 1px solid #e2dbd0; border-radius: 10px; background: #ffffff">
<span style="font-size: 14px; color: #55615f; padding-top: 4px">Challenge de sabre</span>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Sabre M13 Dames <span style="color: #55615f; font-size: 14px">· en cours</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Sabre M13 Hommes <span style="color: #55615f; font-size: 14px">· en cours</span></label>
<span style="font-size: 14px; color: #55615f; padding-top: 8px; border-top: 1px solid #efe9e0">Challenge Orpi</span>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #066f6c"> Épée Seniors Hommes <span style="color: #55615f; font-size: 14px">· non publiée</span></label>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600">Durée d'une page
<span style="display: flex; align-items: center; gap: 8px; font-weight: 400"><input type="number" value="15" min="5" max="120" style="width: 96px; height: 44px; padding: 0 12px; border: 1px solid #7d8886; border-radius: 10px; background: #ffffff; font: inherit"> secondes</span>
</label>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-weight: 600">Vues à afficher</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 12px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Appel des matchs</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Poules</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Classement</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Tableau</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #066f6c"> Podium</label>
</div>
</fieldset>

<div style="display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid #e2dbd0">
<button type="button" style="height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: #0abab5; color: #0f1716; font: inherit; font-weight: 600; cursor: pointer">Enregistrer</button>
<button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #7d8886; border-radius: 10px; background: #ffffff; color: #1c2b2a; font: inherit; cursor: pointer">Annuler</button>
</div>
</form>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
