# Déploiement du serveur Cloudflare (ADR-0004, ADR-0012) :
# branche dev → poule-position-serveur-preview ; branche main → poule-position-serveur (production).
# Lancement manuel possible depuis une autre branche : déploie la preview (PR qui modifie le serveur).
name: Déploiement du serveur

on:
  push:
    branches: [dev, main]
    paths:
      - 'serveur/**'
      - 'paquets/domaine/**'
      - 'paquets/protocole/**'
      - 'package-lock.json'
      - '.github/workflows/deploiement-serveur.yml'
  workflow_dispatch:

concurrency:
  group: deploiement-serveur-${{ github.ref }}

permissions:
  contents: read

jobs:
  deployer:
    name: Wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests du serveur et du protocole
        run: npx vitest run --project serveur --project protocole --project domaine
      - name: Déployer
        working-directory: serveur
        run: npx wrangler deploy ${{ github.ref_name != 'main' && '--env preview' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
